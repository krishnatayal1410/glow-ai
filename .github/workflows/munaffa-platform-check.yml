name: Munaffa Full Platform Check
on:
  push:
    branches: [munaffa-official-v1]
  workflow_dispatch:
jobs:
  verify-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: munaffa-platform/apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Build immersive web app
        run: npm run build
      - name: Install Chromium test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
      - name: Start production preview
        run: |
          npm run preview -- --port 4173 >/tmp/munaffa-web.log 2>&1 &
          sleep 3
      - name: Verify marketing, 3D and operating roles
        run: |
          cat > verify.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1440,height:900},reducedMotion:'reduce'});
          const page=await context.newPage();const errors=[];page.on('pageerror',e=>errors.push(e.message));
          await page.goto('http://127.0.0.1:4173/#home',{waitUntil:'domcontentloaded'});
          await page.waitForSelector('canvas');await page.waitForTimeout(1200);
          if(errors.length)throw new Error(errors.join('\n'));
          if(!(await page.locator('h1').first().textContent()).includes('Munaffa'))throw new Error('home hero missing');
          await page.locator('.menu-btn').click();
          if(!(await page.locator('.menu-overlay').evaluate(el=>el.classList.contains('open'))))throw new Error('3D menu overlay failed');
          await page.locator('.menu-overlay .close').click();
          for(const route of ['product','profit','operations','inventory','guest','ai','pricing']){
            await page.evaluate(r=>location.hash=r,route);await page.waitForTimeout(120);
            if(!(await page.locator('.hero h1').isVisible()))throw new Error(route+' hero missing');
            if(!(await page.locator('canvas').isVisible()))throw new Error(route+' canvas missing');
          }
          for(const role of ['owner','manager','waiter','kitchen','stock','admin','guest']){
            await page.evaluate(r=>location.hash='app/'+r,role);await page.waitForTimeout(100);
            if(!(await page.locator('.ops').isVisible()))throw new Error(role+' workspace missing');
          }
          await page.evaluate(()=>location.hash='app/kitchen');await page.waitForTimeout(100);
          await page.locator('.kds-card').first().click();
          await page.evaluate(()=>location.hash='app/guest');await page.waitForTimeout(100);
          await page.locator('.dish button').first().click();
          if(!(await page.locator('.cart-panel').textContent()).includes('1 items'))throw new Error('guest cart failed');
          await context.close();await browser.close();console.log('Munaffa web platform passed');
          EOF
          node verify.mjs
  verify-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: munaffa-platform/apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund
      - name: Expo project doctor
        run: npx expo-doctor@latest
      - name: Verify native entry
        run: |
          test -f App.jsx
          test -f app.json
          test -f eas.json
          grep -q 'Munaffa' App.jsx
  verify-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Supabase migrations
        run: |
          test -f munaffa-platform/supabase/schema.sql
          test -f munaffa-platform/supabase/seed.sql
          grep -q 'enable row level security' munaffa-platform/supabase/schema.sql
          grep -q 'inventory_movements' munaffa-platform/supabase/schema.sql
          grep -q 'audit_events' munaffa-platform/supabase/schema.sql
