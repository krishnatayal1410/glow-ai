name: Munaffa Immersive V2 Check
on:
  push:
    branches: [munaffa-immersive-v2]
  workflow_dispatch:
jobs:
  verify-web:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: munaffa-platform/apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build immersive web app
        run: npm run build
      - name: Install Chromium test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
      - name: Start production preview
        run: |
          npm run preview -- --port 4173 >/tmp/munaffa-web.log 2>&1 &
          sleep 3
      - name: Verify marketing, auth, consumer and restaurant OS
        run: |
          cat > verify.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1440,height:900},reducedMotion:'reduce'});
          const page=await context.newPage(); page.setDefaultTimeout(5000);
          const errors=[]; const consoleErrors=[];
          page.on('pageerror',e=>errors.push(e.message));
          page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
          const expectCount=async(sel,n=1)=>{const c=await page.locator(sel).count();if(c<n)throw new Error(`${sel} missing: ${c}`)};
          const clickJs=async(sel,index=0)=>page.locator(sel).nth(index).evaluate(el=>el.click());
          await page.goto('http://127.0.0.1:4173/#home',{waitUntil:'domcontentloaded',timeout:30000});
          await page.waitForTimeout(1600);
          if(errors.length)throw new Error('pageerror: '+errors.join(' | '));
          if(consoleErrors.some(x=>!x.includes('favicon')))throw new Error('console error: '+consoleErrors.join(' | '));
          await expectCount('.marketing'); await expectCount('canvas'); await expectCount('.hero-copy h1');
          if(!(await page.locator('.hero-copy h1').textContent()).includes('Munaffa'))throw new Error('home hero missing');
          const canvas=page.locator('canvas').first();
          const canvasWidth=Number(await canvas.getAttribute('width')); const canvasHeight=Number(await canvas.getAttribute('height'));
          if(!canvasWidth||!canvasHeight)throw new Error('3D renderer did not initialize');
          await clickJs('.round-menu'); await page.waitForTimeout(80);
          const menuClass=await page.locator('.immersive-menu').getAttribute('class');
          if(!menuClass?.includes('open'))throw new Error('immersive menu failed');
          await page.locator('.immersive-menu nav button').first().dispatchEvent('mouseenter');
          await clickJs('.menu-close');
          for(const route of ['platform','profit','operations','inventory','guest','ai','discovery','pricing','about']){
            await page.evaluate(r=>location.hash=r,route);await page.waitForTimeout(180);
            await expectCount('.hero-copy h1'); await expectCount('canvas');
            if((await page.locator('.story-chapter').count())!==8)throw new Error(route+' chapter count');
          }
          await page.evaluate(()=>{localStorage.clear();location.hash='signup'});await page.waitForTimeout(220);
          await expectCount('.auth-card');
          await page.locator('input[placeholder="Your name"]').fill('CI Guest');
          await page.locator('input[placeholder="you@example.com"]').fill('ci@example.com');
          await page.locator('input[type="password"]').fill('password123');
          await page.locator('button.primary.wide').click({force:true});await page.waitForTimeout(220);
          await expectCount('.onboard');
          await page.locator('.role-card').first().click({force:true});
          await page.locator('.onboard footer .primary').click({force:true});await page.waitForTimeout(100);
          await page.locator('.onboard footer .primary').click({force:true});await page.waitForTimeout(100);
          await page.locator('.onboard footer .primary').click({force:true});await page.waitForTimeout(260);
          await expectCount('.consumer');
          await page.locator('.venue-open').first().click({force:true});await page.waitForTimeout(100);
          await page.locator('.dish-row>button').first().click({force:true});await page.waitForTimeout(220);
          if(errors.length)throw new Error('consumer add pageerror: '+errors.join(' | '));
          await expectCount('.cart-fab');
          await page.locator('.cart-fab').click({force:true});await page.waitForTimeout(80);
          await expectCount('.checkout');
          await page.locator('.checkout button.primary.wide').click({force:true});await page.waitForTimeout(1100);
          await expectCount('.order-float');
          for(const role of ['owner','manager','cashier','waiter','kitchen','stock','admin']){
            await page.evaluate(r=>location.hash='app/'+r,role);await page.waitForTimeout(180);
            await expectCount('.ops');
          }
          await page.evaluate(()=>location.hash='app/owner');await page.waitForTimeout(180);
          const qrButtons=page.locator('.ops-side nav button');
          const labels=await qrButtons.allTextContents(); const qrIndex=labels.findIndex(x=>x.includes('QR Studio'));
          if(qrIndex<0)throw new Error('QR Studio nav missing');
          await qrButtons.nth(qrIndex).click({force:true});await page.waitForTimeout(100);
          await expectCount('.qr-preview svg');
          await page.evaluate(()=>location.hash='app/cashier');await page.waitForTimeout(180);
          await page.locator('.pos-menu button').first().click({force:true});await page.waitForTimeout(80);
          if(!(await page.locator('.bill-total').textContent()).includes('349'))throw new Error('POS cart failed');
          await page.evaluate(()=>location.hash='app/kitchen');await page.waitForTimeout(180);
          await expectCount('.kot'); await page.locator('.kot').first().click({force:true});
          await page.evaluate(()=>location.hash='app/stock');await page.waitForTimeout(180);
          await expectCount('.stock-tabs');
          if(errors.length)throw new Error('pageerror: '+errors.join(' | '));
          await context.close();await browser.close();console.log('Munaffa immersive v2 web passed');
          EOF
          node verify.mjs
  verify-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: munaffa-platform/apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund
      - name: Expo project doctor
        run: npx expo-doctor@latest
      - name: Verify native feature surface
        run: |
          test -f App.jsx
          test -f app.json
          test -f eas.json
          grep -q 'expo-location' package.json
          grep -q 'expo-camera' package.json
          grep -q 'CameraView' App.jsx
          grep -q 'createClient' App.jsx
          grep -q 'Restaurant' App.jsx
          grep -q 'Owner' App.jsx
  verify-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Supabase core + v2 migration
        run: |
          test -f munaffa-platform/supabase/schema.sql
          test -f munaffa-platform/supabase/migrations/002_consumer_and_identity.sql
          grep -q 'enable row level security' munaffa-platform/supabase/schema.sql
          grep -q 'inventory_movements' munaffa-platform/supabase/schema.sql
          grep -q 'audit_events' munaffa-platform/supabase/schema.sql
          grep -q 'reservations' munaffa-platform/supabase/migrations/002_consumer_and_identity.sql
          grep -q 'service_requests' munaffa-platform/supabase/migrations/002_consumer_and_identity.sql
          grep -q 'restaurant_subscriptions' munaffa-platform/supabase/migrations/002_consumer_and_identity.sql
