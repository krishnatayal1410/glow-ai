name: Munaffa Full Platform Check
on:
  push:
    branches: [munaffa-official-v1]
  workflow_dispatch:
jobs:
  verify-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: munaffa-platform/apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Build immersive web app
        run: npm run build
      - name: Install Chromium test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
      - name: Start production preview
        run: |
          npm run preview -- --port 4173 >/tmp/munaffa-web.log 2>&1 &
          sleep 3
      - name: Verify cinematic site and operating roles
        run: |
          cat > verify.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1440,height:900},reducedMotion:'reduce'});
          const page=await context.newPage();const errors=[];page.on('pageerror',e=>errors.push(e.message));
          await page.goto('http://127.0.0.1:4173/#home',{waitUntil:'domcontentloaded',timeout:30000});
          await page.waitForSelector('canvas');await page.waitForTimeout(900);
          if(errors.length)throw new Error(errors.join('\n'));
          const hero=await page.locator('.hero-text h1').textContent();
          if(!hero?.includes('Munaffa'))throw new Error('home hero missing');
          const canvas=await page.locator('canvas').evaluate(el=>({w:el.width,h:el.height,cw:el.clientWidth,ch:el.clientHeight}));
          if(!canvas.w||!canvas.h)throw new Error('3D canvas failed');
          if(canvas.w/canvas.cw>1.3)throw new Error('desktop DPR too high');
          await page.locator('.cin-menu').click();
          if(!(await page.locator('.full-menu').evaluate(el=>el.classList.contains('open'))))throw new Error('3D navigation failed');
          await page.locator('.full-menu button').nth(1).hover();
          await page.locator('.full-close').click();
          for(const route of ['platform','profit','operations','inventory','guest','ai','integrations','customers','resources','pricing','about','contact']){
            await page.evaluate(r=>location.hash=r,route);await page.waitForTimeout(130);
            if(!(await page.locator('.hero-text h1').isVisible()))throw new Error(route+' hero missing');
            if(!(await page.locator('canvas').isVisible()))throw new Error(route+' 3D world missing');
            if((await page.locator('.cin-chapter').count())!==6)throw new Error(route+' chapter count');
          }
          for(const role of ['owner','manager','cashier','waiter','kitchen','stock','admin','guest']){
            await page.evaluate(r=>location.hash='app/'+r,role);await page.waitForTimeout(100);
            if(!(await page.locator('.operating-os').isVisible()))throw new Error(role+' workspace missing');
          }
          await page.evaluate(()=>location.hash='app/cashier');await page.waitForTimeout(100);
          await page.locator('.menu-grid-pos button').first().click();
          if(!(await page.locator('.bill-total').textContent()).includes('349'))throw new Error('POS cart failed');
          await page.evaluate(()=>location.hash='app/kitchen');await page.waitForTimeout(100);
          await page.locator('.kot').first().click();
          await page.evaluate(()=>location.hash='app/guest');await page.waitForTimeout(100);
          await page.locator('.guest-phone article button').first().click();
          if(!(await page.locator('.op-panel').last().textContent()).includes('1 items'))throw new Error('guest cart failed');
          await context.close();await browser.close();console.log('Munaffa cinematic platform passed');
          EOF
          node verify.mjs
  verify-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: munaffa-platform/apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund
      - name: Expo project doctor
        run: npx expo-doctor@latest
      - name: Verify native entry
        run: |
          test -f App.jsx
          test -f app.json
          test -f eas.json
          grep -q 'Munaffa' App.jsx
          grep -q 'createClient' App.jsx
  verify-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Supabase migrations
        run: |
          test -f munaffa-platform/supabase/schema.sql
          test -f munaffa-platform/supabase/seed.sql
          grep -q 'enable row level security' munaffa-platform/supabase/schema.sql
          grep -q 'inventory_movements' munaffa-platform/supabase/schema.sql
          grep -q 'audit_events' munaffa-platform/supabase/schema.sql
          grep -q 'restaurant_tables' munaffa-platform/supabase/schema.sql
