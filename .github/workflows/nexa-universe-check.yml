name: NEXA Immersive Universe Check
on:
  push:
    branches: [nexa-immersive-universe]
  workflow_dispatch:
# final-motion verification
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static checks
        run: |
          node --check nexa-universe/assets/app.js
          test -f nexa-universe/index.html
          test -f nexa-universe/products/index.html
          test -f nexa-universe/technology/index.html
          test -f nexa-universe/experience/index.html
          test -f nexa-universe/sustainability/index.html
          test -f nexa-universe/stories/index.html
          test -f nexa-universe/support/index.html
          test -f nexa-universe/product/index.html
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Start site
        run: |
          python3 -m http.server 4173 --directory nexa-universe >/tmp/nexa-universe.log 2>&1 &
          sleep 2
      - name: Browser verification
        run: |
          cat > verify.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const pages=['/','/products/','/technology/','/experience/','/sustainability/','/stories/','/support/','/product/'];
          for(const path of pages){
            const context=await browser.newContext({viewport:{width:1440,height:900},reducedMotion:'reduce'});
            const page=await context.newPage();const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:4173'+path,{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(()=>document.querySelector('#loader')?.classList.contains('done'),null,{timeout:10000});
            await page.waitForTimeout(300);
            if(errors.length)throw new Error(path+' '+errors.join('\n'));
            const c=await page.locator('#world').evaluate(el=>({w:el.width,h:el.height,cw:el.clientWidth,ch:el.clientHeight}));
            if(!c.w||!c.h||!c.cw||!c.ch)throw new Error(path+' canvas did not render');
            const metrics=await page.evaluate(()=>window.__NEXA_UNIVERSE__);
            if(!metrics||metrics.dpr>1.3)throw new Error(path+' invalid performance metrics');
            await page.locator('#menuBtn').click();
            if(!(await page.locator('#menuOverlay').evaluate(el=>el.classList.contains('open'))))throw new Error(path+' menu failed');
            await context.close();
          }
          const context=await browser.newContext({viewport:{width:1440,height:900},reducedMotion:'reduce'});const page=await context.newPage();
          await page.goto('http://127.0.0.1:4173/product/',{waitUntil:'domcontentloaded'});await page.waitForTimeout(1300);
          await page.locator('.finish').nth(2).click();
          if(!(await page.locator('.finish').nth(2).evaluate(el=>el.classList.contains('active'))))throw new Error('finish control');
          await page.locator('.buy-button').first().click();
          if(!(await page.locator('.cart-toast').evaluate(el=>el.classList.contains('show'))))throw new Error('cart toast');
          await page.goto('http://127.0.0.1:4173/support/',{waitUntil:'domcontentloaded'});await page.waitForTimeout(1200);
          await page.locator('#supportInput').fill('warranty');
          if(!(await page.locator('.support-topics button[data-keys*="warranty"]').evaluate(el=>el.classList.contains('match'))))throw new Error('support search');
          await context.close();
          const mobile=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,reducedMotion:'reduce'});const mp=await mobile.newPage();
          await mp.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});await mp.waitForTimeout(1200);
          const mm=await mp.evaluate(()=>window.__NEXA_UNIVERSE__);if(!mm||mm.dpr>1.05)throw new Error('mobile quality profile failed');
          if(await mp.locator('.nav nav').isVisible())throw new Error('mobile nav should collapse');
          await mp.locator('#menuBtn').click();if(!(await mp.locator('#menuOverlay').evaluate(el=>el.classList.contains('open'))))throw new Error('mobile menu failed');
          await mobile.close();await browser.close();console.log('NEXA immersive universe passed');
          EOF
          node verify.mjs