name: NEXA Optimized Prototype Check

on:
  push:
    branches: [nexa-cinematic-prototype]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static verification
        run: |
          node --check nexa-cinematic/app.js
          test -f nexa-cinematic/index.html
          test -f nexa-cinematic/styles.css
          grep -q 'id="soundlab"' nexa-cinematic/index.html
          grep -q 'id="compare"' nexa-cinematic/index.html
          grep -q "scrollEngine:'native'" nexa-cinematic/app.js
          grep -q '__NEXA_METRICS__' nexa-cinematic/app.js
      - name: Install browser runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Start site
        run: |
          python3 -m http.server 4173 --directory nexa-cinematic >/tmp/nexa-server.log 2>&1 &
          sleep 2
      - name: Browser checks
        run: |
          cat > nexa-test.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          async function load(viewport,isMobile=false){
            const context=await browser.newContext({viewport,isMobile,hasTouch:isMobile});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:4173',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(()=>document.querySelector('#preloader')?.classList.contains('done'),null,{timeout:10000});
            await page.waitForTimeout(2800);
            if(errors.length)throw new Error(errors.join('\n'));
            return {context,page};
          }
          const desk=await load({width:1440,height:900});
          const page=desk.page;
          const metrics=await page.evaluate(()=>window.__NEXA_METRICS__);
          console.log('desktop',metrics);
          if(metrics.scrollEngine!=='native')throw new Error('wrong scroll engine');
          if(metrics.dpr>1.55)throw new Error('desktop dpr too high');
          if(metrics.drawCalls>40)throw new Error('draw call budget exceeded');
          if(metrics.triangles>120000)throw new Error('triangle budget exceeded');
          await page.locator('[data-model="go"]').evaluate(el=>el.click());
          if((await page.locator('#productName').textContent())?.trim()!=='NEXA Go')throw new Error('model switch');
          await page.locator('.color-swatch[data-name="Deep Blue"]').evaluate(el=>el.click());
          if((await page.locator('#finishName').textContent())?.trim()!=='Deep Blue')throw new Error('finish switch');
          await page.locator('.profile[data-profile="warm"]').evaluate(el=>el.click());
          await page.locator('.anc-mode[data-anc="flight"]').evaluate(el=>el.click());
          await page.locator('.context-card[data-env="home"]').evaluate(el=>el.click());
          await page.locator('#componentList button').nth(3).evaluate(el=>el.click());
          if(!((await page.locator('#partReadout').textContent())||'').includes('40 mm driver'))throw new Error('engineering control');
          await page.locator('.add-cart').first().evaluate(el=>el.click());
          if((await page.locator('#cartCount').textContent())?.trim()!=='1')throw new Error('cart');
          await desk.context.close();
          const mob=await load({width:390,height:844},true);
          const mm=await mob.page.evaluate(()=>window.__NEXA_METRICS__);
          console.log('mobile',mm);
          if(mm.dpr>1.05)throw new Error('mobile dpr too high');
          if(mm.drawCalls>40)throw new Error('mobile draw call budget exceeded');
          await mob.context.close();
          await browser.close();
          console.log('NEXA optimized prototype passed');
          EOF
          node nexa-test.mjs
