name: NEXA Cinematic Prototype Check

on:
  push:
    branches: [nexa-cinematic-prototype]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static verification
        run: |
          node --check nexa-cinematic/app.js
          test -f nexa-cinematic/index.html
          test -f nexa-cinematic/styles.css
          grep -q 'data-scene="explode"' nexa-cinematic/index.html
          grep -q 'NEXA Pro' nexa-cinematic/index.html
          grep -q 'ScrollTrigger' nexa-cinematic/app.js
          grep -q 'Lenis' nexa-cinematic/app.js
          grep -q 'prefers-reduced-motion' nexa-cinematic/styles.css
      - name: Install Chromium test runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Start static server
        run: |
          python3 -m http.server 4173 --directory nexa-cinematic > /tmp/nexa-server.log 2>&1 &
          sleep 2
      - name: Browser interaction smoke test
        run: |
          cat > nexa-test.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 1440, height: 900 }, reducedMotion: 'reduce' });
          const page = await context.newPage();
          const errors = [];
          page.on('pageerror', e => errors.push(`pageerror: ${e.message}`));
          page.on('console', m => { if (m.type() === 'error') errors.push(`console: ${m.text()}`); });
          await page.goto('http://127.0.0.1:4173', { waitUntil: 'domcontentloaded', timeout: 30000 });
          await page.waitForSelector('#nexa-canvas');
          await page.waitForTimeout(2200);
          const canvas = await page.locator('#nexa-canvas').evaluate(el => ({w:el.width,h:el.height}));
          if (canvas.w < 300 || canvas.h < 300) throw new Error('WebGL canvas not sized');
          await page.locator('[data-model="go"]').evaluate(el => el.click());
          if ((await page.locator('#productName').textContent())?.trim() !== 'NEXA Go') throw new Error('Model selector failed');
          await page.locator('.color-swatch[data-name="Deep Blue"]').evaluate(el => el.click());
          await page.locator('.add-cart').evaluate(el => el.click());
          if ((await page.locator('#cartCount').textContent())?.trim() !== '1') throw new Error('Cart count failed');
          if (!(await page.locator('#cartDrawer').evaluate(el => el.classList.contains('open')))) throw new Error('Cart drawer failed');
          await page.locator('#cartClose').evaluate(el => el.click());
          await page.locator('#supportInput').evaluate(el => { el.value='warranty'; el.dispatchEvent(new Event('input',{bubbles:true})); });
          if (!((await page.locator('#supportResult').textContent()) || '').includes('matched')) throw new Error('Support search failed');
          await page.locator('#emailInput').evaluate(el => { el.value='test@example.com'; });
          await page.locator('#newsletterForm').evaluate(el => el.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true})));
          if (!((await page.locator('#newsletterStatus').textContent()) || '').includes('early-access')) throw new Error('Newsletter failed');
          await page.locator('#componentList button').first().evaluate(el => el.click());
          if (!((await page.locator('#partReadout').textContent()) || '').includes('Focused')) throw new Error('3D component control failed');
          await page.evaluate(() => window.scrollTo(0, document.querySelector('#explode').offsetTop + 200));
          await page.waitForTimeout(350);
          if (errors.length) throw new Error(errors.join('\n'));
          await page.screenshot({ path: '/tmp/nexa-prototype.png' });
          console.log('NEXA browser smoke test passed');
          await browser.close();
          EOF
          node nexa-test.mjs
