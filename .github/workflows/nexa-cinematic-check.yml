name: NEXA Optimized Prototype Check

on:
  push:
    branches: [nexa-cinematic-prototype]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static verification
        run: |
          node --check nexa-cinematic/app.js
          test -f nexa-cinematic/index.html
          test -f nexa-cinematic/styles.css
          grep -q 'NEXA CONTROL' nexa-cinematic/index.html
          grep -q 'Quick compare' nexa-cinematic/index.html
          grep -q 'quality.dprCap' nexa-cinematic/app.js
          grep -q 'content-visibility:auto' nexa-cinematic/styles.css
      - name: Install browser runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Start site
        run: |
          python3 -m http.server 4173 --directory nexa-cinematic >/tmp/nexa-server.log 2>&1 &
          sleep 2
      - name: Browser and interaction checks
        run: |
          cat > nexa-test.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          async function load(viewport,isMobile=false){
            const context=await browser.newContext({viewport,isMobile,hasTouch:isMobile,reducedMotion:'reduce'});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:4173',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(()=>document.querySelector('#preloader')?.classList.contains('done'),null,{timeout:10000});
            await page.waitForTimeout(500);
            if(errors.length)throw new Error(errors.join('\n'));
            const canvas=await page.locator('#nexa-canvas').evaluate(el=>({w:el.width,h:el.height,cw:el.clientWidth,ch:el.clientHeight}));
            return {context,page,canvas};
          }
          const desk=await load({width:1440,height:900});
          let ratio=desk.canvas.w/desk.canvas.cw;
          console.log('desktop backing ratio',ratio);
          if(ratio>1.3)throw new Error('desktop DPR/render backing store too high');
          const page=desk.page;
          await page.locator('[data-model="go"]').evaluate(el=>el.click());
          if((await page.locator('#productName').textContent())?.trim()!=='NEXA Go')throw new Error('model switch');
          if((await page.locator('#compareBattery').textContent())?.trim()!=='38 hours')throw new Error('comparison panel');
          await page.locator('.color-swatch[data-name="Deep Blue"]').evaluate(el=>el.click());
          if((await page.locator('#cartColorName').textContent())?.trim()!=='Deep Blue')throw new Error('finish switch');
          await page.locator('.tech-item[data-tech="battery"]').evaluate(el=>el.click());
          if((await page.locator('#techMetric').textContent())?.trim()!=='50 h')throw new Error('technology readout');
          await page.locator('.env[data-env="home"]').evaluate(el=>el.click());
          if((await page.locator('#envProfile').textContent())?.trim()!=='Open Room')throw new Error('environment control');
          await page.locator('.control-tab[data-control="spatial"]').evaluate(el=>el.click());
          if((await page.locator('#controlValue').textContent())?.trim()!=='Immersive')throw new Error('NEXA Control interaction');
          await page.locator('#componentList button').nth(2).evaluate(el=>el.click());
          if(!((await page.locator('#partReadout').textContent())||'').includes('40 mm driver'))throw new Error('engineering control');
          await page.locator('.add-cart').first().evaluate(el=>el.click());
          if((await page.locator('#cartCount').textContent())?.trim()!=='1')throw new Error('cart');
          await page.locator('#checkoutBtn').evaluate(el=>el.click());
          if((await page.locator('#checkoutBtn').textContent())?.trim()!=='Continue to Payment')throw new Error('checkout step');
          await page.locator('#supportInput').fill('warranty');
          if(!((await page.locator('#supportResult').textContent())||'').includes('matched'))throw new Error('support search');
          await page.locator('#emailInput').fill('test@example.com');
          await page.locator('#newsletterForm button').evaluate(el=>el.click());
          if(!((await page.locator('#newsletterStatus').textContent())||'').includes('early-access'))throw new Error('newsletter');
          const raf=await page.evaluate(()=>new Promise(resolve=>{const samples=[];let last=performance.now();function tick(now){samples.push(now-last);last=now;if(samples.length<45)requestAnimationFrame(tick);else resolve({avg:samples.reduce((a,b)=>a+b,0)/samples.length,max:Math.max(...samples)})}requestAnimationFrame(tick)}));
          console.log('desktop RAF',raf);
          if(raf.avg>45)throw new Error(`desktop animation cadence too slow: ${raf.avg}`);
          await desk.context.close();
          const mob=await load({width:390,height:844},true);
          ratio=mob.canvas.w/mob.canvas.cw;
          console.log('mobile backing ratio',ratio);
          if(ratio>1.05)throw new Error('mobile DPR/render backing store too high');
          if(await mob.page.locator('.main-nav').isVisible())throw new Error('mobile navigation should collapse');
          await mob.context.close();
          await browser.close();
          console.log('NEXA optimized prototype passed');
          EOF
          node nexa-test.mjs