name: Munaffa Zero Rebuild Core
on:
  push:
    branches: [munaffa-zero-rebuild]
  workflow_dispatch:
jobs:
  domain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: munaffa
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @munaffa/domain test
      - run: pnpm --filter @munaffa/domain build
      - name: Guard against importing rejected Munaffa implementations
        run: |
          ! grep -R "src/v2\|src/v3\|src/v4\|src/v5\|munaffa-cinematic-v5\|munaffa-realworld-v4" . --exclude-dir=node_modules --exclude=PRODUCT_AND_EXPERIENCE_BLUEPRINT.md
